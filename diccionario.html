<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diccionario - Mi Biblioteca</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/diccionario.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1C2735">
</head>
<body>
    <!-- Sidebar -->
    <div id="sidebarContainer"></div>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <header class="header">
            <button id="menuToggle" class="menu-toggle">☰</button>
            <div class="header-title">
                <span>📚</span>
                <h1>Diccionario Bíblico</h1>
            </div>
        </header>

        <!-- Search Dictionary -->
        <div class="dictionary-search">
            <input
                type="text"
                id="searchDiccionario"
                placeholder="🔎 Buscar palabra..."
                autocomplete="off"
            >
        </div>

        <!-- Empty / portal state: no se muestra ninguna palabra hasta que se busque -->
        <div class="dictionary-empty" id="dictionaryEmpty">
            <div class="dictionary-illustration" aria-hidden="true">
                <svg viewBox="0 0 240 200" class="dictionary-illustration-svg">
                    <circle cx="120" cy="100" r="96" class="illu-circle"></circle>

                    <g class="illu-rays">
                        <line x1="120" y1="118" x2="120" y2="66"></line>
                        <line x1="120" y1="118" x2="95" y2="74"></line>
                        <line x1="120" y1="118" x2="145" y2="74"></line>
                        <line x1="120" y1="118" x2="76" y2="92"></line>
                        <line x1="120" y1="118" x2="164" y2="92"></line>
                    </g>

                    <path d="M96 152 C96 118, 101 98, 120 94 C139 98, 144 118, 144 152 Z" class="illu-body"></path>
                    <circle cx="120" cy="68" r="15" class="illu-head"></circle>
                    <path d="M88 150 Q120 170 152 150" class="illu-legs"></path>

                    <g class="illu-book">
                        <path d="M91 126 L120 120 L120 142 L91 149 Z" class="illu-page"></path>
                        <path d="M149 126 L120 120 L120 142 L149 149 Z" class="illu-page"></path>
                        <line x1="97" y1="130" x2="114" y2="127" class="illu-line"></line>
                        <line x1="97" y1="137" x2="114" y2="134" class="illu-line"></line>
                        <line x1="126" y1="127" x2="143" y2="130" class="illu-line"></line>
                        <line x1="126" y1="134" x2="143" y2="137" class="illu-line"></line>
                    </g>
                </svg>
            </div>
            <p class="dictionary-empty-title">Busca una palabra</p>
            <p class="dictionary-empty-text">Escribe cualquier término bíblico en el buscador para ver su definición y referencia.</p>
        </div>

        <!-- Dictionary Entries (resultados de búsqueda) -->
        <div class="dictionary-list" id="dictionaryList" hidden>
            <!-- Los resultados se cargarán dinámicamente -->
        </div>

        <!-- Dictionary Detail -->
        <div class="dictionary-detail" id="dictionaryDetail" hidden>
            <button id="backToList" class="back-btn" type="button">← Volver</button>
            <h2 id="palabraTitulo"></h2>
            <div class="definicion">
                <h3>Definición</h3>
                <p id="palabraDefinicion"></p>
            </div>
            <div class="referencia">
                <h3>Referencia</h3>
                <p id="palabraReferencia"></p>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="data/diccionario.js"></script>
    <script src="components/sidebar.js"></script>
    <script src="js/diccionario.js"></script>
</body>
</html>
