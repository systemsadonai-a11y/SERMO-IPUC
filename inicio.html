<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Mi Biblioteca</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/inicio.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1C2735">
</head>
<body>
    <!-- Sidebar -->
    <div id="sidebarContainer"></div>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <header class="header">
            <button id="menuToggle" class="menu-toggle">☰</button>
            <div class="header-title">
                <span>📖</span>
                <h1>Mi Biblioteca</h1>
            </div>
        </header>

        <!-- Welcome Message -->
        <div class="welcome-message">
            <h2>Hola, <span id="userName">Usuario</span> 👋</h2>
        </div>

        <!-- Search Bar -->
        <div class="search-container">
            <input 
                type="text" 
                id="searchSermon" 
                placeholder="🔎 Buscar sermón..."
                autocomplete="off"
            >
        </div>

        <!-- Search Results -->
        <div id="searchResults" class="search-results" style="display: none;">
            <h3>Resultados encontrados: <span id="resultCount">0</span></h3>
            <div id="resultsList"></div>
        </div>

        <!-- Folders Section -->
        <div class="folders-section">
            <div class="section-header">
                <h2>Mis carpetas</h2>
                <button id="createFolderBtn" class="btn-create">+ Crear carpeta</button>
            </div>
            
            <div id="foldersGrid" class="folders-grid">
                <!-- Las carpetas se cargarán dinámicamente -->
            </div>
        </div>

        <!-- Folder Detail (prédicas dentro de una carpeta) -->
        <div id="folderDetailView" class="folder-detail" style="display: none;">
            <div class="folder-detail-header">
                <button id="backToFoldersBtn" class="btn-back" type="button">← Carpetas</button>
                <h2 id="folderDetailTitle"></h2>
            </div>
            <div id="folderSermonsList" class="folder-sermons-list">
                <!-- Las prédicas de la carpeta se cargarán dinámicamente -->
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <button id="createSermonBtn" class="btn-quick-action">
                Crear sermón
            </button>
        </div>
    </div>

    <!-- Modal Container -->
    <div id="modalContainer"></div>
    
    <!-- Toast Container -->
    <div id="toastContainer"></div>

    <script src="js/app.js"></script>
    <script src="js/database.js"></script>
    <script src="components/sidebar.js"></script>
    <script src="components/modal.js"></script>
    <script src="components/toast.js"></script>
    <script src="js/inicio.js"></script>
</body>
</html>
