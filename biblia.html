<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblia - Mi Biblioteca</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/biblia.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1C2735">
</head>
<body>
    <!-- Sidebar -->
    <div id="sidebarContainer"></div>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <header class="header">
            <button id="menuToggle" class="menu-toggle">☰</button>
            <div class="header-title">
                <span>📖</span>
                <h1>Biblia</h1>
            </div>
        </header>

        <div class="bible-app">

            <!-- Search (siempre visible) -->
            <div class="bible-search">
                <input
                    type="text"
                    id="searchBiblia"
                    placeholder="🔎 Buscar palabra o versículo..."
                    autocomplete="off"
                >
            </div>

            <!-- Testament Tabs -->
            <div class="testament-tabs" id="testamentTabs">
                <button type="button" class="testament-tab active" data-testamento="Antiguo">
                    Antiguo Testamento
                </button>
                <button type="button" class="testament-tab" data-testamento="Nuevo">
                    Nuevo Testamento
                </button>
            </div>

            <!-- Books Grid -->
            <div class="books-view" id="booksView">
                <div class="books-grid" id="booksGrid">
                    <!-- Los libros se cargarán dinámicamente -->
                </div>
            </div>

            <!-- Chapters Grid -->
            <div class="chapters-view" id="chaptersView" hidden>
                <div class="view-header">
                    <button type="button" class="btn-back" id="backToBooksBtn">← Libros</button>
                    <h2 id="chaptersBookTitle"></h2>
                </div>
                <div class="chapters-grid" id="chaptersGrid">
                    <!-- Los capítulos se cargarán dinámicamente -->
                </div>
            </div>

            <!-- Verses Selection Grid -->
            <div class="verses-select-view" id="versesView" hidden>
                <div class="view-header">
                    <button type="button" class="btn-back" id="backToChaptersBtn">← Capítulos</button>
                    <h2 id="versesBookTitle"></h2>
                </div>
                <div class="verses-select-actions">
                    <button type="button" class="btn-read-all" id="readFullChapterBtn">Leer capítulo completo</button>
                </div>
                <div class="verses-select-grid" id="versesGrid">
                    <!-- Los versículos se cargarán dinámicamente -->
                </div>
            </div>

            <!-- Reading View -->
            <div class="reading-view" id="readingView" hidden>
                <div class="view-header">
                    <button type="button" class="btn-back" id="backFromReadingBtn">← Versículos</button>
                    <h2 id="capituloTitulo">Capítulo 1</h2>
                </div>

                <div id="versiculosContainer" class="verses-container">
                    <!-- Los versículos se cargarán dinámicamente -->
                </div>

                <div class="chapter-navigation">
                    <button type="button" id="prevChapter">← Anterior</button>
                    <span id="currentChapter">1</span>
                    <button type="button" id="nextChapter">Siguiente →</button>
                </div>
            </div>

            <!-- Search Results View -->
            <div class="reading-view" id="searchResultsView" hidden>
                <div class="view-header">
                    <button type="button" class="btn-back" id="backFromSearchBtn">← Volver</button>
                    <h2 id="searchResultsTitle">Resultados</h2>
                </div>
                <div id="searchResultsList" class="verses-container search-results-list">
                    <!-- Los resultados de búsqueda se cargarán dinámicamente -->
                </div>
            </div>

        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="data/biblia.js"></script>
    <script src="components/sidebar.js"></script>
    <script src="js/biblia.js"></script>
</body>
</html>
