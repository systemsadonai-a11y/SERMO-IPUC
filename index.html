<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Biblioteca de Sermones</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1C2735">
</head>
<body>
    <div class="welcome-container">

        <!-- Escena animada: el lector entra y abre la Biblia -->
        <div class="welcome-scene" aria-hidden="true">
            <div class="scene-glow"></div>

            <div class="reader">
                <div class="reader-head"></div>
                <div class="reader-robe"></div>
                <div class="reader-arm"></div>
            </div>

            <div class="book">
                <div class="book-pages">
                    <span class="page-line"></span>
                    <span class="page-line short"></span>
                    <span class="page-line prompt-line">Escribe tu nombre</span>
                </div>
                <div class="book-cover">
                    <span class="cover-cross">✝</span>
                </div>
            </div>
        </div>

        <!-- Tarjeta de bienvenida, estilizada como la página del libro -->
        <div class="welcome-card" id="welcomeCard">
            <div class="logo">
                <span class="logo-icon">📖</span>
                <h1>Mi Biblioteca de Sermones</h1>
            </div>

            <div class="welcome-content">
                <h2>Bienvenido</h2>
                <p class="prompt-text">¿Cómo te llamas?</p>

                <form id="welcomeForm" autocomplete="off">
                    <input
                        type="text"
                        id="nombreUsuario"
                        placeholder="Escribe tu nombre"
                        required
                        autocomplete="off"
                    >
                    <button type="submit" class="btn-primary">
                        Continuar
                    </button>
                </form>
            </div>
        </div>

    </div>

    <script src="js/app.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
